<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quiz01</title>
<style>
table {
  border-collapse: collapse;
  display: inline-block;
  margin: 10px;
  vertical-align: top;
}
table, th, td {
  border: 1px solid black;
}
td {
  width: 50px;
  height: 40px;
  text-align: center;
  text-transform: uppercase;
}
</style>
</head>
<body>

<table>
<tr><td>x</td><td>x</td><td>x</td></tr>
<tr><td>x</td><td>x</td><td>x</td></tr>
<tr><td>x</td><td>x</td><td>x</td></tr>
</table>

<table>
<tr><td>x</td><td rowspan="2">x</td><td>x</td></tr>
<tr><td>x</td><td>x</td></tr>
<tr><td>x</td><td>x</td><td>x</td></tr>
</table>

<table>
<tr><td>x</td><td>x</td><td>x</td></tr>
<tr><td rowspan="2" colspan="2">x</td><td>x</td></tr>
<tr><td>x</td></tr>
</table>

<table>
<tr><td colspan="2">x</td><td>x</td></tr>
<tr><td>x</td><td>x</td><td>x</td></tr>
<tr><td>x</td><td>x</td><td>x</td></tr>
</table>

<table>
<tr><td colspan="2">x</td><td>x</td></tr>
<tr><td>x</td><td rowspan="2">x</td><td>x</tr>
<tr><td>x</td><td>x</td></tr>
</table>

<table>
<tr><td colspan="2">x</td><td>x</td></tr>
<tr><td>x</td><td rowspan="2" colspan="2">x</td></tr>
<tr><td>x</td></tr>
</table>

<table>
<tr><td>x</td><td rowspan="2">x</td><td>x</td></tr>
<tr><td>x</td><td>x</td></tr>
<tr><td>x<td>x</td><td>x</td></tr>
</table>

<table>
<tr><td>x</td><td>x</td><td>x</td></tr>
<tr><td rowspan="2" colspan="2">x</td><td>x</td></tr>
<tr><td>x</td></tr>
</table>

<table>
<tr><td colspan="2">x</td><td>x</td></tr>
<tr><td>x</td><td rowspan="2" colspan="2">x</td></tr>
<tr><td>x</td></tr>
</table>

</body>
</html>
