<!DOCTYPE html>
<html>
<body>
    <input type="text" id="number1" placeholder="Enter Number 1"> <br/>
    <input type="text" id="number2" placeholder="Enter Number 2"> <br/>
    <button type="button" onclick="getResult()">
    Click me to display the Sum.</button> <br/>

    <input type="text" id="sum" placeholder="Sum" readonly> <br/>
    <input type="text" id="diff" placeholder="Difference" readonly> <br/>
    <input type="text" id="product" placeholder="Product" readonly> <br/>
    <input type="text" id="quotient" placeholder="Quotient" readonly> <br/>
    <input type="text" id="mod" placeholder="Modulus" readonly>
</body>
</html>
<script>
    function getResult() {
        var num1 = parseFloat(document.getElementById("number1").value);
        var num2 = parseFloat(document.getElementById("number2").value);

        var sum = num1 + num2;
        var diff = num1 - num2;
        var product = num1 * num2;
        var quotient = num1 / num2;
        var mod = num1 % num2;

        document.getElementById("sum").value = sum;
        document.getElementById("diff").value = diff;
        document.getElementById("product").value = product;
        document.getElementById("quotient").value = quotient;
        document.getElementById("mod").value = mod;
    }
</script>
